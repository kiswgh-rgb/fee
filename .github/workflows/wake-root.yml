name: wake-root
# 수동 단추 — push 마다 깨우면 하위 1분 + 루트 run 이 커밋 수만큼 나가 무료분을 월 중순에 다 쓴다(루트 DECISIONS 2026-10-13).
# 루트 CI 는 하루 두 번 예약으로 전 repo 를 본다. 이 repo 만 지금 보고 싶을 때 Actions 탭에서 Run workflow.
on: { workflow_dispatch: {} }
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # PAT 가 비었거나 만료돼도 종전 `curl -sf` 는 bare exit 22 로만 죽어 원인이 안 보였다.
      # 알림은 실패 사실이 아니라 고칠 자리를 가리켜야 한다 — HTTP 코드·응답본문을 찍는다.
      # ★줄잇기(역슬래시) 쓰지 말 것 — 이 파일은 10곳에 바이트 동일 복제된다(check_ci_workflows C1).
      - run: |
          if [ -z "${{ secrets.WORKSPACE_PAT }}" ]; then
            echo "::error::WORKSPACE_PAT 이 이 repo 의 Actions Secrets 에 없다 — 루트 CI 가 깨어나지 못한다"
            exit 1
          fi
          api=https://api.github.com/repos/kiswgh-rgb/projects-workspace/dispatches
          payload='{"event_type":"subrepo-push","client_payload":{"repo":"${{ github.event.repository.name }}"}}'
          code=$(curl -s -o /tmp/dispatch.out -w '%{http_code}' -X POST -H "Authorization: Bearer ${{ secrets.WORKSPACE_PAT }}" -H "Accept: application/vnd.github+json" "$api" -d "$payload")
          if [ "$code" != "204" ]; then
            echo "::error::루트 dispatch 실패 HTTP $code (401/403 이면 WORKSPACE_PAT 만료·권한부족)"
            cat /tmp/dispatch.out
            exit 1
          fi
