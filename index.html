<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fee">
<meta name="theme-color" content="#F4F2ED">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<title>Fee v10.40</title>
<style>
  :root {
    --bg-primary: #FFFFFF;
    --bg-secondary: #ECE9E2;
    --bg-tertiary: #F4F2ED;
    --text-primary: #23231F;
    --text-secondary: #5E5B53;
    --text-tertiary: #8C887E;
    --border: rgba(35,35,30,0.10);
    --accent: #263B5E;
    --accent-dark: #1B2A44;
    --accent-bg: #E4E9F1;
    --warn: #A23B2E;
    --amber: #B07A1E;
    --mark: #3B5FA0;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    overflow-x: hidden;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body {
    min-height: 100vh;
    min-height: -webkit-fill-available;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }
  .container {
    max-width: 380px;
    margin: 0 auto;
    padding: 16px 16px calc(104px + env(safe-area-inset-bottom, 0));
  }
  /* 가로 끌기는 앱이 받는다(스와이프 탭 이동) · 세로 스크롤만 브라우저에 */
  #app { touch-action: pan-y; }
  /* 머리 = 큰 날짜 숫자(v10.36 · 캔버스 C) — 지난날이면 숫자·부제가 --mark 로 바뀌어 오늘과 갈린다 */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 0 0 4px;
    margin-bottom: 20px;
  }
  .date-num { font-size: 44px; font-weight: 800; line-height: 1; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .date-text { flex: 1; min-width: 0; }
  .date-label { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .date-sub { font-size: 12px; font-weight: 500; color: var(--text-tertiary); }
  .date-dday { font-size: 12px; color: var(--text-tertiary); padding-right: 4px; white-space: nowrap; }
  .header.past .date-num, .header.past .date-sub { color: var(--mark); }
  .header.past .date-sub { font-weight: 600; }
  .day-tag.past { color: var(--mark); font-weight: 700; }
  .check-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }
  .cell {
    grid-column: 1 / -1;
    min-height: 64px;
    padding: 12px 16px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    transition: background 0.2s, outline-color 0.2s;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .cell.half { grid-column: auto; } /* v10.40 점심·저녁 = 한 줄에 반씩 */
  .cell.checked {
    background: var(--accent-bg);
    border-color: transparent;
    outline: 1.5px solid var(--accent);
    outline-offset: -1.5px;
  }
  .cell-name {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .cell.checked .cell-name { color: var(--accent-dark); }
  .cell-count {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-tertiary);
    letter-spacing: 0.02em;
  }
  .cell.checked .cell-count { color: var(--accent); }
  .cell-weight {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .cell.checked .cell-weight { color: var(--accent); }
  .cell-tix { font-size: 18px; letter-spacing: 2px; line-height: 1; }
  .summary {
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
  }
  .summary .total-val {
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
  }
  .bucket-num { font-size: 13px; font-weight: 400; color: var(--text-secondary); margin-left: 2px; }
  .calendar {
    background: var(--bg-secondary);
    border-radius: var(--radius-lg);
    padding: 14px;
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .cal-nav {
    width: 32px; height: 32px;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--text-primary);
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    font-size: 18px;
    font-family: inherit;
  }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-nav:not(:disabled):active { background: var(--bg-tertiary); }
  .cal-title { font-size: 13px; font-weight: 500; }
  .cal-weekdays, .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
  }
  .cal-weekdays { margin-bottom: 8px; }
  .cal-grid { row-gap: 10px; }
  .cal-weekday {
    text-align: center;
    font-size: 11px;
    color: var(--text-tertiary);
    padding: 2px 0;
  }
  .cal-weekday.sun { color: #E4572E; }
  .cal-weekday.sat { color: #111111; }
  .cal-cell {
    position: relative;
    aspect-ratio: 1;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    border: 0.5px solid var(--border);
    background: var(--bg-primary);
    color: var(--text-primary);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  .cal-cell.disabled { opacity: 0.35; pointer-events: none; }
  /* 고른 날 = 파란 테두리 + 「고른 날」 꼬리표 · 오늘 = 숫자 대신 「오늘」 — 농도가 검정까지 가서 테두리만으론 묻혔다 */
  .cal-cell.selected { outline: 2.5px solid var(--mark); outline-offset: 1px; font-weight: 800; }
  .cal-cell.today { outline: 1.5px solid var(--text-primary); outline-offset: 1px; font-weight: 800; font-size: 11px; }
  .cal-cell.today.selected { outline: 2.5px solid var(--mark); }
  .cal-pin {
    position: absolute; left: 50%; top: -12px; transform: translateX(-50%);
    white-space: nowrap; font-size: 9px; font-weight: 700; line-height: 14px;
    padding: 0 5px; border-radius: 7px; color: #FFFFFF; background: var(--mark); pointer-events: none;
  }
  .cal-cell.blank { background: transparent; border: none; pointer-events: none; }
  /* F 달력 막대(v10.26): 위 둘 = 공부(빨강) · 아래 = 케틀벨(초록) · 안 한 항목은 회색 */
  .cal-cell.bars { flex-direction: column; gap: 3px; }
  .cal-num { font-size: 10px; line-height: 12px; }
  .cal-bars { display: flex; flex-direction: column; gap: 2px; width: 70%; }
  .cal-bars i { display: block; height: 4px; border-radius: 2px; background: #E0DCD3; }
  .cal-bars i.study.on { background: #B4473A; }
  .cal-bars i.move.on { background: #4F7A4A; }
  .cal-bars i.light.on { background: #D9AE4A; }
  .record-bar {
    margin-top: 14px;
    text-align: center;
  }
  .record-btn {
    padding: 8px 18px;
    font-size: 12px;
    font-family: inherit;
    color: var(--text-tertiary);
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
    letter-spacing: 0.02em;
  }
  .record-btn:active { background: var(--bg-secondary); }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal {
    background: var(--bg-primary);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 360px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    padding: 14px 16px 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    border-bottom: 0.5px solid var(--border);
  }
  .modal-body {
    padding: 12px 14px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-desc {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    line-height: 1.45;
  }
  .modal-textarea {
    width: 100%;
    min-height: 260px;
    padding: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.45;
    border: 0.5px solid var(--border);
    border-radius: 6px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    resize: vertical;
    box-sizing: border-box;
    -webkit-appearance: none;
  }
  .modal-msg {
    margin-top: 8px;
    font-size: 12px;
    min-height: 16px;
  }
  .modal-msg.ok { color: var(--accent); }
  .modal-msg.err { color: #B33A2C; }
  .modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    border-top: 0.5px solid var(--border);
  }
  .modal-footer-right {
    display: flex;
    gap: 6px;
  }
  .modal-btn {
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    border-radius: 6px;
    border: 0.5px solid var(--border);
    background: var(--bg-primary);
    color: var(--text-primary);
    cursor: pointer;
    touch-action: manipulation;
  }
  .modal-btn:active { background: var(--bg-secondary); }
  .modal-btn.primary {
    background: var(--accent);
    color: #FFFFFF;
    border-color: var(--accent);
  }
  .modal-btn.primary:active { background: var(--accent-dark); }
  .loading {
    text-align: center;
    padding: 32px 0;
    color: var(--text-secondary);
    font-size: 14px;
  }
  .sync-field { margin-bottom: 10px; }
  .sync-field label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .sync-input {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    border: 0.5px solid var(--border);
    border-radius: 6px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    box-sizing: border-box;
    -webkit-appearance: none;
  }
  .study-cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .study-row {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 56px; padding: 10px 14px;
    border: 0.5px solid var(--border); border-radius: var(--radius-md); background: var(--bg-primary);
  }
  .study-name { font-size: 16px; font-weight: 500; color: var(--text-primary); }
  .study-ctrl { display: flex; align-items: center; gap: 10px; }
  .study-hours { font-size: 15px; font-weight: 500; color: var(--accent); min-width: 50px; text-align: center; font-variant-numeric: tabular-nums; }
  .study-step {
    width: 36px; height: 36px; padding: 0; font-size: 20px; font-family: inherit; line-height: 1;
    border: 0.5px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary);
    cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center;
  }
  .study-step:disabled { opacity: 0.3; }
  .study-step:not(:disabled):active { background: var(--bg-tertiary); }
  .study-summary { text-align: center; font-size: 12px; letter-spacing: -0.2px; color: var(--text-secondary); margin-bottom: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .study-summary span { color: var(--accent); font-weight: 600; }
  .study-summary b.day-tag { font-weight: 400; color: inherit; }
  .study-summary b.day-tag.past { color: var(--mark); font-weight: 700; }
  .study-summary #study-goal1, .study-summary #study-goal2 { color: var(--text-tertiary); font-weight: 400; } /* 회색 = 끝 목표(계기판 밑 줄과 같은 표기) */
  #view-study .calendar { margin-bottom: 12px; }
  /* v10.35 색 = 먹·남색 · 공부 달력 판만 모노·코랄(캔버스 1+5) — 변수를 이 판 안에서만 덮어쓴다 */
  #view-study .calendar {
    background: #EEEEEC;
    --bg-primary: #FFFFFF; --border: rgba(0,0,0,0.10);
    --text-primary: #111111; --text-tertiary: #8E8E8A; --bg-tertiary: #E4E4E1;
  }
  /* 공부 속도계(반원) — S 뷰에선 달력 바로 아래 */
  .study-gauge {
    display: flex; flex-direction: column; align-items: center;
    border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    background: var(--bg-primary); padding: 12px 14px 10px; margin-bottom: 16px;
  }
  .study-gauge.empty { display: none; }
  .study-gauge .sg-top { display: flex; justify-content: space-between; align-items: baseline; width: 100%; }
  .study-gauge .sg-name { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .study-gauge .sg-date { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .study-gauge .sg-row { display: flex; justify-content: space-between; width: 100%; gap: 8px; margin-top: 6px; }
  .study-gauge .sg-col { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .study-gauge .sg-col .sg-date { font-size: 11px; }
  .study-gauge .sg-svg { width: 100%; max-width: 160px; height: auto; display: block; margin-top: 2px; }
  .study-gauge .sg-pct { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: -6px; }
  .study-gauge .sg-line { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .study-gauge .sg-line b { color: var(--text-primary); font-weight: 700; }
  .study-gauge .sg-line .sg-fin { font-size: 10.5px; color: var(--text-tertiary); margin-left: 3px; }
  /* 계기판 밑 유념 포스트잇(v10.38) — 문구 정본 = CHI_fee_data semu_memo.json(HQ 가 쓴다 · 앱은 읽기만) */
  .study-memo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 2px 4px 0; margin-bottom: 16px; font-family: 'Nanum Pen Script', cursive; }
  .study-memo.empty { display: none; }
  .study-memo .sm-note { background-color: #F6F2E7; background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 27px, #E6DFCC 27px, #E6DFCC 28px); padding: 10px 12px 14px; box-shadow: 0 2px 4px rgba(35,35,30,0.12); display: flex; flex-direction: column; min-height: 130px; transform: rotate(-1.2deg); }
  .study-memo .sm-note:nth-child(even) { transform: rotate(1deg); }
  .study-memo .sm-title { align-self: flex-start; font-size: 27px; line-height: 34px; color: #5A4A2C; background-image: linear-gradient(to bottom, transparent 58%, #EADBB0 58%, #EADBB0 92%, transparent 92%); }
  .study-memo .sm-sub { font-size: 16px; line-height: 22px; color: #6B5F48; }
  .study-memo .sm-body { font-size: 21px; line-height: 28px; color: #4A4740; margin-top: 8px; white-space: pre-line; }
  /* 하단 = 떠 있는 동기화 알약 하나(v10.29 · S/F 탭은 스와이프로) · 설정은 오른쪽 아래 구석 작은 점(알약과 같은 줄) */
  .navbar {
    position: fixed; left: 0; right: 0; z-index: 90;
    bottom: calc(24px + env(safe-area-inset-bottom, 0));
    display: flex; justify-content: center; pointer-events: none;
  }
  /* v10.31: 바탕색 알약(회색 글씨 · 아이콘만 파랑) — 파란 알약이 너무 튀었다 */
  .sync-pill {
    pointer-events: auto;
    width: 250px; height: 40px; border-radius: 20px;
    border: 0.5px solid rgba(0,0,0,0.08); background: rgba(236,233,226,0.92);
    color: var(--text-secondary); cursor: pointer;
    font-size: 14px; font-weight: 500; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    touch-action: manipulation; transition: transform 0.12s, background 0.12s;
  }
  .sync-pill:active { transform: scale(0.97); background: var(--bg-tertiary); }
  .set-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%); pointer-events: auto;
    width: 40px; height: 40px; padding: 0; border: none; border-radius: 8px;
    background: transparent; color: var(--text-tertiary); cursor: pointer;
    display: flex; align-items: center; justify-content: center; touch-action: manipulation;
  }
  .set-btn:active { background: var(--bg-secondary); }
  /* 설정은 잘 안 써서 눈에 안 띄게 — 구석의 작은 점 하나(누르는 칸은 40px 그대로) */
  .set-dot { width: 6px; height: 6px; border-radius: 50%; background: #B9B4A9; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
    bottom: calc(88px + env(safe-area-inset-bottom, 0)); z-index: 120;
    max-width: 320px; width: max-content; padding: 10px 16px; border-radius: 8px;
    background: #2A2A2A; color: #FFF; font-size: 13px; line-height: 1.4; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: var(--accent); }
  .toast.err { background: #B33A2C; }
  .set-actions { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .set-action-btn {
    padding: 11px 12px; font-size: 14px; font-family: inherit; border-radius: 8px;
    border: 0.5px solid var(--border); background: var(--bg-secondary); color: var(--text-primary);
    cursor: pointer; touch-action: manipulation; text-align: left;
  }
  .set-action-btn b { display: block; font-size: 14px; }
  .set-action-btn small { color: var(--text-tertiary); font-weight: 400; }
  .set-action-btn:active { background: var(--bg-tertiary); }
  .set-lastsync { font-size: 12px; color: var(--text-tertiary); margin: 6px 0; }
  .set-adv { margin-top: 10px; border-top: 0.5px solid var(--border); padding-top: 10px; }
  .set-adv summary { font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  .set-adv-btns { display: flex; gap: 6px; margin-top: 8px; }
  .set-adv-btns .modal-btn { flex: 1; }
  /* F 달력 = 띠 3줄(v10.33 · 캔버스 띠-다): 한 달을 항목별 띠로 · 보기 전용 — 날짜 고르기는 머리 ‹ › */
  .day-nav {
    flex: none;
    width: 40px; height: 44px; padding: 0; border: none; border-radius: 8px;
    background: transparent; color: var(--text-secondary); font-size: 20px; font-family: inherit;
    cursor: pointer; touch-action: manipulation;
  }
  .day-nav:disabled { opacity: 0.3; cursor: default; }
  .day-nav:not(:disabled):active { background: var(--bg-secondary); }
  /* 띠 높이 v10.36 = 막대 34px(+20% · 폰 화면 아래가 비어서) · 위 22px = 고른 날 꼬리표 자리 */
  .cal-ribbon { display: flex; gap: 8px; }
  .rb-labels { display: flex; flex-direction: column; gap: 5px; padding-top: 26px; }
  .rb-labels span { height: 34px; width: 26px; display: flex; align-items: center; font-size: 11px; font-weight: 500; color: var(--text-secondary); }
  .rb-labels span.half { height: 14.5px; font-size: 10px; } /* v10.39 점심·저녁 = 반 막대 둘(간격 포함 34px 한 줄 자리) */
  .rb-grid { flex: 1; min-width: 0; display: grid; column-gap: 2px; padding-top: 22px; }
  .rb-col { position: relative; display: flex; flex-direction: column; gap: 5px; padding: 4px 0 2px; border-radius: 5px; min-width: 0; }
  .rb-col i { display: block; height: 34px; border-radius: 2px; background: #E0DCD3; }
  .rb-col i.study.on { background: #B4473A; }
  .rb-col i.move.on { background: #4F7A4A; }
  .rb-col i.light.on { background: #D9AE4A; } /* 점심·저녁 = 가벼운 공부라 아침(벽돌)보다 한 단계 약하게 */
  .rb-col i.half { height: 14.5px; }
  .rb-col i.na, .cal-bars i.na { background: transparent; box-shadow: inset 0 0 0 1px #E0DCD3; }
  .rb-col i.rb-off { background: transparent; box-shadow: inset 0 0 0 1px #E0DCD3; }
  .rb-col.sel { box-shadow: 0 0 0 2px var(--mark); }
  .rb-col.today { outline: 1.5px solid var(--text-primary); outline-offset: 1px; }
  .rb-col.today.sel { outline: none; }
  .rb-pin {
    position: absolute; left: 50%; top: -21px; transform: translateX(-50%);
    white-space: nowrap; font-size: 10px; font-weight: 700; line-height: 16px;
    padding: 0 5px; border-radius: 7px; color: #FFFFFF; background: var(--mark); pointer-events: none;
  }
  .rb-pin.l { left: 0; transform: none; }
  .rb-pin.r { left: auto; right: 0; transform: none; }
  .rb-num { height: 12px; display: flex; justify-content: center; font-size: 9px; line-height: 12px; white-space: nowrap; font-weight: 500; color: var(--text-secondary); }
  .rb-num.red { color: #B4473A; }
  .rb-col.dim .rb-num { color: #C4BFB4; }
  .rb-col.today .rb-num { font-weight: 800; color: var(--text-primary); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div id="loading" class="loading">불러오는 중...</div>
  <div id="app" class="hidden">
    <div id="app-header" class="header">
      <div id="date-num" class="date-num">—</div>
      <div class="date-text">
        <div id="date-label" class="date-label">—</div>
        <div id="date-sub" class="date-sub">—</div>
      </div>
      <div id="date-dday" class="date-dday"></div>
      <button id="day-prev" type="button" class="day-nav" aria-label="전날">‹</button>
      <button id="day-next" type="button" class="day-nav" aria-label="다음 날">›</button>
    </div>

    <div id="view-habit">
      <div id="check-grid" class="check-grid"></div>
      <div class="summary">
        <div><span id="today-tag" class="day-tag">오늘</span> <span id="today-liter">0.00</span>L</div>
        <div>누적 <strong class="total-val"><span id="bucket-current">0.00</span></strong> / <span id="bucket-goal">365</span>L<span id="bucket-num" class="bucket-num"></span></div>
      </div>
    </div>

    <div id="view-study" class="hidden">
      <div id="study-cards" class="study-cards"></div>
      <div class="study-summary"><b id="study-today-tag" class="day-tag">오늘</b> <span id="study-today">0.0</span>h · 누적 <span id="study-total">0</span> / 1차 <span id="study-goal1">0</span> · 최종 <span id="study-goal2">0</span>h</div>
      <div id="study-gauge" class="study-gauge empty"></div>
      <div id="study-memo" class="study-memo empty"></div>
    </div>

    <div id="calendar" class="calendar">
      <div class="cal-header">
        <button id="cal-prev" type="button" class="cal-nav" aria-label="이전 달">‹</button>
        <div id="cal-title" class="cal-title">—</div>
        <button id="cal-next" type="button" class="cal-nav" aria-label="다음 달">›</button>
      </div>
      <div id="cal-weekdays" class="cal-weekdays"></div>
      <div id="cal-grid" class="cal-grid"></div>
      <div id="cal-ribbon" class="cal-ribbon hidden"></div>
    </div>
  </div>

  <nav id="navbar" class="navbar hidden">
    <button id="nav-sync" type="button" class="sync-pill">동기화</button>
    <button id="nav-settings" type="button" class="set-btn" aria-label="설정"><span class="set-dot"></span></button>
  </nav>
  <div id="toast" class="toast"></div>

  <div id="modal-record" class="modal-backdrop hidden">
    <div class="modal">
      <div id="modal-record-header" class="modal-header">원문(JSON)</div>
      <div class="modal-body">
        <div class="modal-desc">
          전체 데이터(JSON)입니다. 직접 수정한 뒤 반영을 누르면 저장됩니다.
          복사해서 백업해 두거나, 백업본을 붙여넣어 복구할 수 있습니다.
        </div>
        <textarea id="record-text" class="modal-textarea" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
        <div id="record-msg" class="modal-msg"></div>
      </div>
      <div class="modal-footer">
        <button id="record-select-all" type="button" class="modal-btn">전체선택</button>
        <div class="modal-footer-right">
          <button id="record-close" type="button" class="modal-btn">닫기</button>
          <button id="record-apply" type="button" class="modal-btn primary">반영</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-settings" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">동기화 설정</div>
      <div class="modal-body">
        <div class="modal-desc">
          PAT는 이 기기 localStorage에만 저장되며 코드에는 남지 않습니다.
          대상 레포 Contents 쓰기 권한이 있는 fine-grained 토큰을 사용하세요.
        </div>
        <div class="sync-field">
          <label for="set-owner">owner (GitHub 계정명)</label>
          <input id="set-owner" class="sync-input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="예: kiswgh-rgb">
        </div>
        <div class="sync-field">
          <label for="set-repo">레포</label>
          <input id="set-repo" class="sync-input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="CHI_fee_data">
        </div>
        <div class="sync-field">
          <label for="set-branch">브랜치</label>
          <input id="set-branch" class="sync-input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="main">
        </div>
        <div class="sync-field">
          <label for="set-pat">Personal Access Token</label>
          <input id="set-pat" class="sync-input" type="password" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" placeholder="github_pat_...">
        </div>
        <div class="sync-field">
          <label for="set-routine-path">습관 파일</label>
          <input id="set-routine-path" class="sync-input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="daily_routine.json">
        </div>
        <div class="sync-field">
          <label for="set-study-path">스터디 파일</label>
          <input id="set-study-path" class="sync-input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="semu_study.json">
        </div>
        <div class="set-actions">
          <button id="set-up" type="button" class="set-action-btn"><b>⬆ 올리기 (폰 → repo)</b><small>현재 기록을 repo에 백업 (2파일)</small></button>
          <button id="set-down" type="button" class="set-action-btn"><b>⬇ 복구 (repo → 폰)</b><small>repo 데이터로 폰 채우기 (2파일)</small></button>
        </div>
        <div id="set-lastsync" class="set-lastsync">마지막 동기화: 없음</div>
        <div id="set-msg" class="modal-msg"></div>
        <details class="set-adv">
          <summary>고급 · 원문 JSON 백업/복구</summary>
          <div class="set-adv-btns">
            <button id="set-raw-routine" type="button" class="modal-btn">습관 원문</button>
            <button id="set-raw-study" type="button" class="modal-btn">스터디 원문</button>
          </div>
        </details>
      </div>
      <div class="modal-footer">
        <span></span>
        <div class="modal-footer-right">
          <button id="set-close" type="button" class="modal-btn">닫기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const STORAGE_PREFIX = 'fee_v10_';
  const CONFIG_VERSION = 'v10.40';
  const APP_VERSION = 'v10.40';
  const START_DATE = new Date(2026, 4, 10);
  START_DATE.setHours(0,0,0,0);
  const EPSILON = 0.001;

  // chi_bootstrap_2026-05-13 확정 사항
  const DEFAULT_CONFIG = {
    version: CONFIG_VERSION,
    items: [
      { name: '아침공부', weight: 40 },
      { name: '점심공부', weight: 15 },
      { name: '저녁공부', weight: 15 },
      { name: '케틀벨',   weight: 30 }
    ],
    daily_total: 1.0,
    bucket_goal: 365,
    bootstrap_source: 'chi_bootstrap_2026-05-13'
  };

  // === v9.6 → v10.x 마이그레이션 (최초 1회만 실행) ===
  const LEGACY_IMPORT = {
    seed_total_liter: 7.599999999999996,
    legacy_items: [
      { name: '아침공부', weight: 30 },
      { name: '점심공부', weight: 10 },
      { name: '저녁공부', weight: 30 },
      { name: '케틀벨',   weight: 30 }
    ],
    legacy_daily_total: 1,
    legacy_cutoff_date: '2026-05-25',
    days: {
      '2026-05-10': [false, true, true, true],
      '2026-05-11': [false, true, true, true],
      '2026-05-12': [false, true, true, true],
      '2026-05-13': [false, true, true, true],
      '2026-05-14': [false, false, false, true],
      '2026-05-15': [true, false, false, true],
      '2026-05-16': [true, false, false, false],
      '2026-05-17': [false, true, false, true],
      '2026-05-18': [false, false, true, true],
      '2026-05-19': [false, false, true, false],
      '2026-05-20': [false, true, false, false],
      '2026-05-21': [true, true, true, true],
      '2026-05-22': [false, false, true, true],
      '2026-05-25': [true, false, false, true]
    }
  };

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2,'0');
  const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const sameDay = (a,b) => a.getTime() === b.getTime();
  const isToday = (d) => { const t=new Date(); t.setHours(0,0,0,0); return sameDay(d,t); };
  const weekdayKo = (d) => ['일','월','화','수','목','금','토'][d.getDay()];
  const haptic = () => { try { if(navigator.vibrate) navigator.vibrate(15); } catch(e){} };

  function getKey(k){
    try { const v = localStorage.getItem(STORAGE_PREFIX + k); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
  function setKey(k, v){
    try { localStorage.setItem(STORAGE_PREFIX + k, JSON.stringify(v)); return true; }
    catch(e){ return false; }
  }
  function delKey(k){ try { localStorage.removeItem(STORAGE_PREFIX + k); } catch(e){} }
  function listKeys(prefix){
    const out = [];
    try {
      for(let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(STORAGE_PREFIX + prefix) === 0){
          out.push(k.slice(STORAGE_PREFIX.length));
        }
      }
    } catch(e){}
    return out;
  }

  function itemsSignature(items){
    return items.map(i => `${i.name}:${i.weight}`).join('|');
  }

  // === 항목 '이름만' 바꾸는 리네임 (v10.8: 수면의식 → 아침공부) ===
  // 순서·가중치는 그대로라 day:*.checks 의 인덱스 의미가 안 바뀐다 →
  // 시그니처 비교 전에 저장된 config 의 이름을 갈아끼워 초기화 경로를 타지 않게 한다.
  const ITEM_RENAMES = { '수면의식': '아침공부' };

  function applyItemRenames(items){
    const done = [];
    items.forEach(it => {
      const nn = ITEM_RENAMES[it.name];
      if(nn && nn !== it.name){ done.push(`${it.name} → ${nn}`); it.name = nn; }
    });
    return done;
  }

  // === 항목 나눔 (v10.39: 저녁공부 → 점심공부·저녁공부) ===
  // checks 는 인덱스 저장 → 옛 3칸 day:* 의 1번 자리에 null(그때는 안 쟀다 · 안 함과 구별)을 끼워
  // 옛 저녁 체크가 새 저녁(2번)으로 옮겨진다. 시그니처 비교 전에 돌아 초기화 경로를 안 탄다.
  const ITEM_SPLIT = { from: '아침공부:40|저녁공부:30|케틀벨:30', at: 1, len: 3 };

  function applyItemSplit(c){
    if(!c.items || itemsSignature(c.items) !== ITEM_SPLIT.from) return false;
    listKeys('day:').forEach(k => {
      const day = getKey(k);
      if(day && Array.isArray(day.checks) && day.checks.length === ITEM_SPLIT.len){
        day.checks.splice(ITEM_SPLIT.at, 0, null);
        setKey(k, day);
      }
    });
    c.items = JSON.parse(JSON.stringify(DEFAULT_CONFIG.items));
    return true;
  }

  function runLegacyImport(){
    if(getKey('legacy_imported')) return false;

    const lw = LEGACY_IMPORT.legacy_items.reduce((s,i)=> s + i.weight, 0);
    const liters = LEGACY_IMPORT.legacy_items.map(i => (i.weight / lw) * LEGACY_IMPORT.legacy_daily_total);

    Object.keys(LEGACY_IMPORT.days).forEach(dk => {
      const checks = LEGACY_IMPORT.days[dk];
      let dl = 0;
      checks.forEach((c, i) => { if(c) dl += liters[i]; });
      const ratio = Math.min(1, dl / LEGACY_IMPORT.legacy_daily_total);
      setKey('legacy:' + dk, { ratio: ratio });
    });

    setKey('total_liter', LEGACY_IMPORT.seed_total_liter);
    setKey('legacy_imported', true);
    setKey('legacy_cutoff', LEGACY_IMPORT.legacy_cutoff_date);
    return true;
  }

  let config = null;
  let currentDay = null;
  let totalLiter = 0;
  let viewDate = new Date(); viewDate.setHours(0,0,0,0);
  if(viewDate.getTime() < START_DATE.getTime()) viewDate = new Date(START_DATE);
  let calMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  let migrationNote = null;

  // 항목별 누적 달성 일수 (v10 day:* 키에서만 집계)
  let itemCounts = [];

  function recomputeItemCounts(){
    itemCounts = config.items.map(()=> 0);
    listKeys('day:').forEach(k => {
      const day = getKey(k);
      if(!day || !day.checks) return;
      day.checks.forEach((c, i) => {
        if(c && itemCounts[i] !== undefined) itemCounts[i] += 1;
      });
    });
  }

  function loadConfig(){
    let c = getKey('config');

    if(!c){
      c = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      setKey('config', c);
      return { config: c, note: null };
    }

    // 리네임을 시그니처 비교보다 먼저 — 이름만 바뀐 건 '항목 변경'이 아니다(데이터 보존)
    const renamed = c.items ? applyItemRenames(c.items) : [];
    const split = applyItemSplit(c);

    const oldSig = c.items ? itemsSignature(c.items) : '';
    const newSig = itemsSignature(DEFAULT_CONFIG.items);

    if(oldSig !== newSig){
      listKeys('day:').forEach(delKey);
      listKeys('legacy:').forEach(delKey);
      delKey('total_liter');
      delKey('legacy_imported');
      delKey('legacy_cutoff');
      c = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      setKey('config', c);
      return { config: c, note: '항목 변경 — 기존 데이터 초기화됨' };
    }

    let updated = false;
    if(renamed.length){ updated = true; migrationNote = `항목 이름 변경 — ${renamed.join(', ')}`; }
    if(split){ updated = true; migrationNote = '항목 나눔 — 저녁공부 → 점심공부·저녁공부 (기록 보존)'; }
    if(c.version !== CONFIG_VERSION){ c.version = CONFIG_VERSION; updated = true; }
    if(c.bucket_goal !== DEFAULT_CONFIG.bucket_goal){
      const oldGoal = c.bucket_goal;
      c.bucket_goal = DEFAULT_CONFIG.bucket_goal;
      updated = true;
      migrationNote = `통 목표 ${oldGoal}L → ${DEFAULT_CONFIG.bucket_goal}L`;
    }
    if(c.daily_total !== DEFAULT_CONFIG.daily_total){ c.daily_total = DEFAULT_CONFIG.daily_total; updated = true; }
    if(c.bootstrap_source !== DEFAULT_CONFIG.bootstrap_source){ c.bootstrap_source = DEFAULT_CONFIG.bootstrap_source; updated = true; }
    // 이전 버전의 start_date 잔재 제거
    c.items.forEach(it => { if('start_date' in it) delete it.start_date; });
    if(updated) setKey('config', c);
    return { config: c, note: migrationNote };
  }

  function initTotalLiter(){
    const s = getKey('total_liter');
    if(typeof s === 'number'){ totalLiter = s; return; }
    let sum = 0;
    listKeys('day:').forEach(k => {
      const day = getKey(k);
      if(!day || !day.checks) return;
      day.checks.forEach((c, i) => {
        if(c && config.items[i]) sum += config.items[i].liter;
      });
    });
    totalLiter = sum;
    setKey('total_liter', totalLiter);
  }

  function computeItemLiters(){
    const tw = config.items.reduce((s,i)=> s + i.weight, 0);
    config.items.forEach(it => { it.liter = (it.weight / tw) * config.daily_total; });
  }

  function bucketState(){
    const bn = Math.floor(totalLiter / config.bucket_goal) + 1;
    const cb = totalLiter - (bn - 1) * config.bucket_goal;
    return { bucketNum: bn, currentInBucket: cb };
  }

  function loadDay(d){
    let day = getKey('day:' + dateKey(d));
    if(!day) day = { checks: config.items.map(()=>false) };
    while(day.checks.length < config.items.length) day.checks.push(false);
    day.checks.length = config.items.length;
    return day;
  }
  function saveDay(d, day){ setKey('day:' + dateKey(d), day); }

  function dayLiter(checks){
    let s = 0;
    checks.forEach((c, i) => { if(c && config.items[i]) s += config.items[i].liter; });
    return s;
  }

  function isLegacyDate(d){
    const cutoff = getKey('legacy_cutoff');
    if(!cutoff) return false;
    return dateKey(d) <= cutoff;
  }

  function renderDate(){
    const tk = dateKey(new Date()), vk = dateKey(viewDate);
    $('day-prev').disabled = vk <= dateKey(START_DATE);
    $('day-next').disabled = vk >= tk;
    renderHeadDate();
    if(isLegacyDate(viewDate) && getKey('legacy:' + dateKey(viewDate))){
      $('date-sub').textContent += ' · 이월 기록';
    }
  }

  // S·F 공용 머리 — 큰 숫자 + 「오늘」/「N일 전」 · 요약 줄의 「오늘」 자리도 지난날이면 날짜로
  function renderHeadDate(){
    const t = new Date(); t.setHours(0,0,0,0);
    const ago = Math.round((t.getTime() - viewDate.getTime()) / 86400000);
    const past = ago > 0;
    $('app-header').classList.toggle('past', past);
    $('date-num').textContent = String(viewDate.getDate());
    $('date-label').textContent = `${viewDate.getMonth()+1}월 ${weekdayKo(viewDate)}요일`;
    $('date-sub').textContent = past ? `오늘(${t.getDate()}일)보다 ${ago}일 전` : '오늘';
    const tag = past ? `${viewDate.getDate()}일` : '오늘';
    ['today-tag', 'study-today-tag'].forEach(id => { $(id).textContent = tag; $(id).classList.toggle('past', past); });
  }

  function buildCell(idx){
    const it = config.items[idx];
    const checked = currentDay.checks[idx];
    const legacy = isLegacyDate(viewDate);
    const cell = document.createElement('div');
    cell.className = 'cell' + (HABIT_BAR_CLASS[idx] && HABIT_BAR_CLASS[idx].includes('half') ? ' half' : '') + (checked ? ' checked' : '');
    cell.dataset.idx = idx;
    cell.setAttribute('role', 'button');
    cell.setAttribute('tabindex', '0');
    cell.setAttribute('aria-pressed', checked ? 'true' : 'false');

    if(legacy){
      cell.style.opacity = '0.5';
      cell.style.cursor = 'not-allowed';
    }

    // v10.32: 횟수·비중 표시 뺌 — 케틀벨 칸 오른쪽엔 휴식권만
    cell.innerHTML = '<div class="cell-name">' + it.name + '</div>' +
      (it.name === TICKET_ITEM ? '<div class="cell-tix" aria-label="휴식권"></div>' : '');
    if(it.name === TICKET_ITEM) paintTickets(cell);

    if(!legacy) attachTap(cell, idx);
    return cell;
  }

  // 케틀벨 휴식권(DECISIONS 2026-10-22): 3일 연속 → 1장 · 쉰 날(쿠폰을 썼든 아니든)은 연속이 끊겨 전부 소멸
  // 연속 = 보는 날까지 이어진 날수 — 그날 아직 안 했으면 전날까지로 센다(하루가 끝나기 전엔 끊긴 게 아님)
  const TICKET_ITEM = '케틀벨', TICKET_EVERY = 3, TICKET_SHOW_MAX = 5;
  function ticketsAt(d){
    const i = config.items.findIndex(it => it.name === TICKET_ITEM);
    if(i < 0) return 0;
    const done = (x) => { const day = getKey('day:' + dateKey(x)); return !!(day && day.checks && day.checks[i]); };
    const x = new Date(d);
    if(!done(x)) x.setDate(x.getDate() - 1);
    let streak = 0;
    while(streak < 3660 && done(x)){ streak++; x.setDate(x.getDate() - 1); }
    return Math.floor(streak / TICKET_EVERY);
  }
  function paintTickets(cell){
    const el = cell.querySelector('.cell-tix');
    if(!el) return;
    const n = ticketsAt(viewDate);
    el.textContent = n <= 0 ? '' : n <= TICKET_SHOW_MAX ? '🏷️'.repeat(n) : '🏷️×' + n;
  }

  function attachTap(cell, idx){
    let tStartX = 0, tStartY = 0, tTouched = false;
    const TOL = 10;

    function toggle(){
      const nc = !currentDay.checks[idx];
      currentDay.checks[idx] = nc;
      const delta = config.items[idx].liter * (nc ? 1 : -1);
      totalLiter = Math.max(0, totalLiter + delta);
      // 항목 카운트 증감
      itemCounts[idx] = Math.max(0, (itemCounts[idx] || 0) + (nc ? 1 : -1));
      cell.classList.toggle('checked', nc);
      cell.setAttribute('aria-pressed', nc ? 'true' : 'false');
      // 카운트 표시 갱신
      const cntEl = cell.querySelector('.cell-count');
      if(cntEl) cntEl.textContent = itemCounts[idx] + 'D';
      updateSummary();
      paintCalCell(viewDate);
      haptic();
      saveDay(viewDate, currentDay);
      setKey('total_liter', totalLiter);
      paintTickets(cell);
    }

    cell.addEventListener('touchstart', (e) => {
      if(e.touches && e.touches[0]){
        tStartX = e.touches[0].clientX;
        tStartY = e.touches[0].clientY;
      }
      tTouched = true;
    }, { passive: true });

    cell.addEventListener('touchend', (e) => {
      if(!tTouched) return;
      let moved = false;
      if(e.changedTouches && e.changedTouches[0]){
        const dx = e.changedTouches[0].clientX - tStartX;
        const dy = e.changedTouches[0].clientY - tStartY;
        if(Math.abs(dx) > TOL || Math.abs(dy) > TOL) moved = true;
      }
      if(!moved){ e.preventDefault(); toggle(); }
      setTimeout(() => { tTouched = false; }, 400);
    }, { passive: false });

    cell.addEventListener('touchcancel', () => { tTouched = false; }, { passive: true });
    cell.addEventListener('click', () => { if(tTouched) return; toggle(); });
    cell.addEventListener('keydown', (e) => {
      if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); toggle(); }
    });
  }

  function updateSummary(){
    $('today-liter').textContent = dayLiter(currentDay.checks).toFixed(2);
    const bs = bucketState();
    $('bucket-current').textContent = bs.currentInBucket.toFixed(2);
    $('bucket-goal').textContent = String(config.bucket_goal);
    $('bucket-num').textContent = bs.bucketNum > 1 ? ` (통 ${bs.bucketNum})` : '';
  }

  function renderChecks(){
    currentDay = loadDay(viewDate);
    const grid = $('check-grid');
    grid.innerHTML = '';
    config.items.forEach((_, i) => grid.appendChild(buildCell(i)));
  }

  function densityStyle(r){
    if(r < EPSILON) return { bg: null, fg: null, stage: 0 };
    if(r < 0.30 - EPSILON) return { bg: '#E4E4E1', fg: '#1A1A1A', stage: 1 };
    if(r < 0.60 - EPSILON) return { bg: '#B4B4B0', fg: '#1A1A1A', stage: 2 };
    if(r < 0.90 - EPSILON) return { bg: '#6B6B67', fg: '#FFFFFF', stage: 3 };
    return { bg: '#111111', fg: '#FFFFFF', stage: 4 };
  }

  // 일·공휴일=빨강·토=파랑 — 진한 칸(흰 글자 단계)에선 밝은 톤으로 대비 유지
  const WEEKEND_FG = { '0': ['#E4572E', '#FF9A8F'], '6': ['#111111', '#A9C3FA'] };
  function applyCellStyle(cell, r){
    const s = densityStyle(r);
    const we = WEEKEND_FG[cell.dataset.hol ? '0' : cell.dataset.wd];
    if(s.bg){
      cell.style.background = s.bg;
      cell.style.borderColor = 'transparent';
      cell.style.color = we ? we[s.stage >= 3 ? 1 : 0] : s.fg;
    } else {
      cell.style.background = 'var(--bg-primary)';
      cell.style.borderColor = 'var(--border)';
      cell.style.color = we ? we[0] : 'var(--text-primary)';
    }
  }

  function ratioFromKey(k){
    const day = getKey('day:' + k);
    if(day && day.checks){
      let l = 0;
      day.checks.forEach((c, i) => { if(c && config.items[i]) l += config.items[i].liter; });
      if(l > 0) return Math.min(1, l / config.daily_total);
    }
    const legacy = getKey('legacy:' + k);
    if(legacy && typeof legacy.ratio === 'number') return legacy.ratio;
    return 0;
  }

  // 현재 뷰에 맞는 달력 색 비율 (습관=달성비율 / 스터디=시간합×밀도)
  function calRatioFromKey(k){
    return currentView === 'study' ? studyRatioFromKey(k) : ratioFromKey(k);
  }

  // F 달력 막대는 항목 의미가 지금과 같은 날만(v10.8 리네임 전 1번 칸 = 수면의식) — 그 전·legacy 는 옛 농도
  const HABIT_BAR_FROM = '2026-08-11';
  const HABIT_BAR_CLASS = ['study', 'light half', 'light half', 'move'];
  const habitBars = (checks) => HABIT_BAR_CLASS.map((c, i) => '<i class="' + c + (checks[i] === null ? ' na' : checks[i] ? ' on' : '') + '"></i>').join('');
  function habitBarChecks(k){
    if(currentView === 'study' || k < HABIT_BAR_FROM || k > dateKey(new Date())) return null;
    const day = getKey('day:' + k);
    return (day && day.checks) || [];
  }
  function paintCell(cell, k){
    const checks = habitBarChecks(k);
    if(!checks){
      if(cell.classList.contains('bars')){ cell.classList.remove('bars'); cell.textContent = String(Number(k.slice(8))); }
      applyCellStyle(cell, calRatioFromKey(k));
      return;
    }
    cell.classList.add('bars');
    cell.innerHTML = '<span class="cal-num">' + Number(k.slice(8)) + '</span><span class="cal-bars">' + habitBars(checks) + '</span>';
    applyCellStyle(cell, 0);
  }

  const RIBBON_LABELS = ['아침', '점심', '저녁', '케틀'];
  function renderRibbon(){
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const n = new Date(y, m + 1, 0).getDate();
    const todayK = dateKey(new Date()), selK = dateKey(viewDate), startK = dateKey(START_DATE);
    // 날짜 숫자는 한 칸이 좁아 이웃끼리 겹친다 — 오늘(「오늘」)·고른 날(위 꼬리표)의 양옆은 비우고, 1·5의 배수·말일은 그 옆자리가 비어 있을 때만
    const shown = new Set(), busy = new Set();
    const inMonth = (x) => x.getFullYear() === y && x.getMonth() === m;
    if(inMonth(new Date())){ const td = new Date().getDate(); shown.add(td); busy.add(td); }
    if(inMonth(viewDate)) busy.add(viewDate.getDate());
    const tryShow = (dd) => { if(dd >= 1 && dd <= n && !busy.has(dd) && !busy.has(dd - 1) && !busy.has(dd + 1) && !shown.has(dd - 1) && !shown.has(dd + 1)) shown.add(dd); };
    [1, 5, 10, 15, 20, 25, 30, n].forEach(tryShow);
    let cols = '';
    for(let day = 1; day <= n; day++){
      const d = new Date(y, m, day), k = dateKey(d);
      const dim = k < startK || k > todayK;
      let cells;
      if(dim) cells = HABIT_BAR_CLASS.map(c => '<i class="' + c + ' rb-off"></i>').join('');
      else {
        const checks = habitBarChecks(k);
        if(checks) cells = habitBars(checks);
        else { const s = densityStyle(ratioFromKey(k)); cells = HABIT_BAR_CLASS.map(c => '<i class="' + c + '"' + (s.bg ? ' style="background:' + s.bg + '"' : '') + '></i>').join(''); }
      }
      const show = shown.has(day);
      const red = d.getDay() === 0 || isHoliday(d);
      const pin = (k === selK && k !== todayK)
        ? '<span class="rb-pin' + (day <= 2 ? ' l' : day >= n - 1 ? ' r' : '') + '">' + day + ' ' + weekdayKo(d) + '</span>' : '';
      cols += '<div class="rb-col' + (k === selK ? ' sel' : '') + (k === todayK ? ' today' : '') + (dim ? ' dim' : '') + '">' + pin + cells +
        '<span class="rb-num' + (red ? ' red' : '') + '">' + (show ? (k === todayK ? '오늘' : day) : '') + '</span></div>';
    }
    $('cal-ribbon').innerHTML = '<div class="rb-labels">' + RIBBON_LABELS.map((l, i) => '<span' + (HABIT_BAR_CLASS[i].includes('half') ? ' class="half"' : '') + '>' + l + '</span>').join('') + '</div>' +
      '<div class="rb-grid" style="grid-template-columns: repeat(' + n + ', minmax(0, 1fr))">' + cols + '</div>';
  }

  function paintCalCell(d){
    if(currentView !== 'study'){ renderRibbon(); return; }
    const k = dateKey(d);
    const cell = document.querySelector('[data-cal-key="' + k + '"]');
    if(!cell) return;
    paintCell(cell, k);
  }

  // 달력 첫날 = F 는 앱 시작일 · S 는 첫 공부 기록일(그 전은 비활성 — 표시만, 누적 무관)
  function calStartDate(){
    if(currentView !== 'study') return START_DATE;
    const e = studyEarliestKey();
    return e ? parseDateKey(e) : START_DATE;
  }

  function renderCalendar(){
    $('cal-title').textContent = `${calMonth.getFullYear()}.${pad(calMonth.getMonth()+1)}`;
    const habit = currentView !== 'study';
    $('cal-weekdays').classList.toggle('hidden', habit);
    $('cal-grid').classList.toggle('hidden', habit);
    $('cal-ribbon').classList.toggle('hidden', !habit);
    if(habit){ renderRibbon(); return; }

    const wd = $('cal-weekdays');
    if(!wd.hasChildNodes()){
      ['일','월','화','수','목','금','토'].forEach((w, i) => {
        const el = document.createElement('div');
        el.className = 'cal-weekday' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
        el.textContent = w;
        wd.appendChild(el);
      });
    }

    const grid = $('cal-grid');
    grid.innerHTML = '';
    const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    const last  = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0);
    const firstWd = first.getDay();
    const today = new Date(); today.setHours(0,0,0,0);
    const calStart = calStartDate();

    for(let i = 0; i < firstWd; i++){
      const blank = document.createElement('div');
      blank.className = 'cal-cell blank';
      grid.appendChild(blank);
    }

    for(let day = 1; day <= last.getDate(); day++){
      const d = new Date(calMonth.getFullYear(), calMonth.getMonth(), day);
      const k = dateKey(d);
      const before = d.getTime() < calStart.getTime();
      const future = d.getTime() > today.getTime();
      const isSel = sameDay(d, viewDate);
      const isTod = sameDay(d, today);

      const cell = document.createElement('div');
      cell.className = 'cal-cell' +
        ((before||future) ? ' disabled' : '') +
        (isSel ? ' selected' : '') +
        (isTod ? ' today' : '');
      cell.dataset.calKey = k;
      cell.dataset.wd = String(d.getDay());
      if(isHoliday(d)) cell.dataset.hol = '1';
      cell.textContent = isTod ? '오늘' : String(day);
      if(isSel && !isTod) cell.insertAdjacentHTML('afterbegin', '<span class="cal-pin">고른 날</span>');

      if(!before && !future){
        let cTouched = false;
        cell.addEventListener('touchend', (e) => {
          cTouched = true;
          e.preventDefault();
          onDateSelected(d);
        }, { passive: false });
        cell.addEventListener('click', () => {
          if(cTouched){ cTouched = false; return; }
          onDateSelected(d);
        });
      }

      grid.appendChild(cell);
      paintCell(cell, k);
    }
  }

  function canPrev(){
    const lastOfPrev = new Date(calMonth.getFullYear(), calMonth.getMonth(), 0);
    return lastOfPrev.getTime() >= calStartDate().getTime();
  }
  function canNext(){
    const today = new Date(); today.setHours(0,0,0,0);
    const nextFirst = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1);
    return nextFirst.getTime() <= today.getTime();
  }
  function updateCalNav(){
    $('cal-prev').disabled = !canPrev();
    $('cal-next').disabled = !canNext();
  }

  $('cal-prev').addEventListener('click', () => {
    if(!canPrev()) return;
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1);
    renderCalendar();
    updateCalNav();
  });
  $('cal-next').addEventListener('click', () => {
    if(!canNext()) return;
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1);
    renderCalendar();
    updateCalNav();
  });

  // ===== 기록 모달 =====
  function collectRecord(){
    const data = {
      format: 'fee-record-1',
      exported_at: new Date().toISOString(),
      app_version: APP_VERSION,
      config: getKey('config'),
      total_liter: getKey('total_liter'),
      days: {},
      legacy: {},
      legacy_cutoff: getKey('legacy_cutoff') || null
    };
    listKeys('day:').forEach(k => {
      const dk = k.slice(4);
      data.days[dk] = getKey(k);
    });
    listKeys('legacy:').forEach(k => {
      const dk = k.slice(7);
      data.legacy[dk] = getKey(k);
    });
    return data;
  }

  // ===== 원문(JSON) 모달 — 습관/스터디 공용 =====
  let rawTarget = 'routine';
  function showMsg(text, kind){
    const m = $('record-msg');
    m.textContent = text;
    m.className = 'modal-msg' + (kind ? ' ' + kind : '');
  }
  function openRawModal(target){
    rawTarget = target;
    $('modal-record-header').textContent = (target === 'study') ? '스터디 원문(JSON)' : '습관 원문(JSON)';
    $('record-text').value = JSON.stringify(target === 'study' ? collectStudy() : collectRecord(), null, 2);
    showMsg('', '');
    $('modal-record').classList.remove('hidden');
  }
  function closeRecordModal(){ $('modal-record').classList.add('hidden'); }

  // 습관 데이터 import (localStorage 저장 + 상태 갱신; DOM 렌더는 호출측 reloadAll)
  function applyRoutineData(parsed){
    if(!parsed || typeof parsed !== 'object') throw new Error('데이터 형식 오류');
    if(!parsed.config || !Array.isArray(parsed.config.items)) throw new Error('config.items 누락');
    if(parsed.days && typeof parsed.days !== 'object') throw new Error('days 형식 오류');
    if(parsed.legacy && typeof parsed.legacy !== 'object') throw new Error('legacy 형식 오류');

    listKeys('day:').forEach(delKey);
    listKeys('legacy:').forEach(delKey);
    delKey('config'); delKey('total_liter'); delKey('legacy_cutoff');

    setKey('legacy_imported', true);
    setKey('config', parsed.config);
    if(typeof parsed.total_liter === 'number') setKey('total_liter', parsed.total_liter);
    if(parsed.legacy_cutoff) setKey('legacy_cutoff', parsed.legacy_cutoff);
    if(parsed.days) Object.keys(parsed.days).forEach(dk => setKey('day:' + dk, parsed.days[dk]));
    if(parsed.legacy) Object.keys(parsed.legacy).forEach(dk => setKey('legacy:' + dk, parsed.legacy[dk]));

    const cr = loadConfig();
    config = cr.config;
    computeItemLiters();
    recomputeItemCounts();

    const ts = getKey('total_liter');
    if(typeof ts === 'number'){
      totalLiter = ts;
    } else {
      totalLiter = 0;
      listKeys('day:').forEach(k => {
        const day = getKey(k);
        if(!day || !day.checks) return;
        day.checks.forEach((c, i) => { if(c && config.items[i]) totalLiter += config.items[i].liter; });
      });
      setKey('total_liter', totalLiter);
    }
  }

  function applyRecord(){
    let parsed;
    try { parsed = JSON.parse($('record-text').value); }
    catch(e){ showMsg('JSON 형식 오류: ' + e.message, 'err'); return; }
    try {
      if(rawTarget === 'study') applyStudy(parsed);
      else applyRoutineData(parsed);
      reloadAll();
      showMsg('반영 완료', 'ok');
      setTimeout(closeRecordModal, 600);
    } catch(e){
      showMsg('반영 실패: ' + (e && e.message ? e.message : e), 'err');
    }
  }

  $('record-close').addEventListener('click', closeRecordModal);
  $('record-apply').addEventListener('click', applyRecord);
  $('record-select-all').addEventListener('click', () => {
    const ta = $('record-text');
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch(e){}
  });

  // ===== 토스트 =====
  let toastTimer = null;
  function toast(text, kind){
    const t = $('toast');
    t.textContent = text;
    t.className = 'toast show' + (kind ? ' ' + kind : '');
    if(toastTimer){ clearTimeout(toastTimer); toastTimer = null; }
    if(kind){ toastTimer = setTimeout(() => { t.className = 'toast'; }, 2800); }
  }

  // ===== Study(시험 진도) =====
  const DEFAULT_STUDY_CONFIG = {
    version: 'sv2',
    subjects: ['세법학','재무회계','원가회계','재정학','행정소송법'],
    hours_step: 0.5, hours_min: 0, hours_max: 8,
    density_map: { '1':'하', '2':'중', '3':'상' },
    // 속도계 구간 (HQ plans/semu_master.json stages[1차].milestones 에서 옮긴 원장 파생 상수 — 손편집 ❌ · semu_cascade.py --재생성 이 다시 쓴다)
    // 속도계는 end(구간 경계)만 쓴다 · cum 은 옛 누적 목표(참고) · weekly_cap/7 = 게이지 오른쪽 끝(초맥시멈)
    exams: [ { name: '1차', date: '2027-04-25', weekly_cap: 36, milestones_rev: '2026-10-26', milestones: [
      { phase: 1, end: '2026-09-19', cum: 170 },
      { phase: 2, end: '2026-11-13', cum: 1420.5 },
      { phase: 3, end: '2026-12-31', cum: 1664.5 },
      { phase: 4, end: '2027-03-02', cum: 1956.5 },
      { phase: 5, end: '2027-04-25', cum: 2236.5 }
    ] } ]
  };
  const STUDY_DENSITY_FACTOR = { 1: 0.8, 2: 1.0, 3: 1.2 };
  let currentView = 'habit';
  let studyConfig = null;
  let studyDay = { hours: {}, density: null };
  let studyTotal = 0;
  // 누계 표시용(HQ semu_master time_structure) — 앱 이전 기누적 · 1차(2027)·최종(2028 2차) 목표 누계(사용자 2026-10-20)
  const STUDY_PRIOR_HOURS = 1100;
  const STUDY_GOALS = { first: 2100, final: 4100 };

  function loadStudyConfig(){
    let c = getKey('study_config');
    if(!c || typeof c !== 'object'){
      c = JSON.parse(JSON.stringify(DEFAULT_STUDY_CONFIG));
      setKey('study_config', c);
      return c;
    }
    // 비파괴: subjects가 달라도 study:* 일별 기록은 절대 삭제하지 않음. 누락 필드만 보정.
    let updated = false;
    // v10.16: 회계학 → 재무·원가 분리(비파괴 — 지난 study:* 의 회계학 기록은 남고 누계에 계속 포함)
    if(c.version !== 'sv2' && Array.isArray(c.subjects)){ const i = c.subjects.indexOf('회계학'); if(i >= 0){ c.subjects.splice(i, 1, '재무회계', '원가회계'); updated = true; } }
    if(c.version !== DEFAULT_STUDY_CONFIG.version){ c.version = DEFAULT_STUDY_CONFIG.version; updated = true; }
    if(!Array.isArray(c.subjects) || !c.subjects.length){ c.subjects = DEFAULT_STUDY_CONFIG.subjects.slice(); updated = true; }
    if(typeof c.hours_step !== 'number'){ c.hours_step = 0.5; updated = true; }
    if(typeof c.hours_min !== 'number'){ c.hours_min = 0; updated = true; }
    if(typeof c.hours_max !== 'number'){ c.hours_max = 8; updated = true; }
    if(!c.density_map){ c.density_map = DEFAULT_STUDY_CONFIG.density_map; updated = true; }
    if(!Array.isArray(c.exams) || !c.exams.length){ c.exams = DEFAULT_STUDY_CONFIG.exams.slice(); updated = true; }
    // 속도계 baseline 비파괴 보정: exams[0]에 weekly_cap/milestones 누락 시에만 채움
    const dex = DEFAULT_STUDY_CONFIG.exams[0];
    const ex0 = c.exams[0];
    if(ex0){
      if(typeof ex0.weekly_cap !== 'number'){ ex0.weekly_cap = dex.weekly_cap; updated = true; }
      // 구간 상수는 원장 파생물 — 누락이거나 상수 판(milestones_rev)이 다르면 덮어쓴다(사용자 손 설정 아님 · 다른 칸은 비파괴)
      if(!Array.isArray(ex0.milestones) || !ex0.milestones.length || ex0.milestones_rev !== dex.milestones_rev){ ex0.milestones = JSON.parse(JSON.stringify(dex.milestones)); ex0.milestones_rev = dex.milestones_rev; updated = true; }
    }
    if(updated) setKey('study_config', c);
    return c;
  }

  function loadStudyDay(d){
    let s = getKey('study:' + dateKey(d));
    if(!s || typeof s !== 'object') s = { hours: {}, density: null };
    if(!s.hours || typeof s.hours !== 'object') s.hours = {};
    if(s.density !== 1 && s.density !== 2 && s.density !== 3) s.density = null;
    return s;
  }
  function saveStudyDay(d, s){ setKey('study:' + dateKey(d), s); }

  function studyDayHours(s){
    let sum = 0;
    if(s && s.hours) Object.keys(s.hours).forEach(k => { const v = s.hours[k]; if(typeof v === 'number') sum += v; });
    return sum;
  }
  function recomputeStudyTotal(){
    let sum = 0;
    listKeys('study:').forEach(k => { sum += studyDayHours(getKey(k)); });
    studyTotal = sum;
  }

  function isWeekend(d){ const w = d.getDay(); return w === 0 || w === 6; }
  // 빨간 날(사용자 구글 캘린더 🇰🇷 · 2026~2027 — 2028 은 넣어야 한다) — 달력 빨강 + 공부 기준
  const KR_HOLIDAYS = new Set([
    '2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02','2026-05-01','2026-05-05','2026-05-24','2026-05-25',
    '2026-06-03','2026-06-06','2026-07-17','2026-08-15','2026-08-17','2026-09-24','2026-09-25','2026-09-26','2026-10-03','2026-10-05','2026-10-09','2026-12-25',
    '2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-02-09','2027-03-01','2027-05-01','2027-05-03','2027-05-05','2027-05-13',
    '2027-06-06','2027-07-17','2027-07-19','2027-08-15','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-03','2027-10-04','2027-10-09','2027-10-11','2027-12-25','2027-12-27'
  ]);
  // 쉬는 날 규칙(사용자 2026-10-19 · HQ 4100h 경로와 같은 셈): 평일 공휴일·설 이틀(전날·당일)·추석 평일 = 쉼(0h) · 그 밖의 설 연휴일 = 주말처럼
  const SEOL_REST  = new Set(['2026-02-16','2026-02-17','2027-02-06','2027-02-07']);
  const SEOL_STUDY = new Set(['2026-02-18','2027-02-08']);
  const isHoliday = d => KR_HOLIDAYS.has(dateKey(d));
  const isRestDay = d => { const k = dateKey(d); return SEOL_REST.has(k) || (isHoliday(d) && !isWeekend(d) && !SEOL_STUDY.has(k)); };
  // 스터디 달력 농도 = min(1, (시간합 × 밀도계수) / 기준(평일4·주말·휴일8))
  function studyRatioFromKey(k){
    const s = getKey('study:' + k);
    if(!s) return 0;
    const hours = studyDayHours(s);
    if(hours <= 0) return 0;
    const factor = STUDY_DENSITY_FACTOR[s.density] || 1.0;
    const p = k.split('-');
    const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    const base = (isWeekend(d) || isHoliday(d)) ? 8 : 4;
    return Math.min(1, (hours * factor) / base);
  }

  function ddayString(){
    const ex = studyConfig && studyConfig.exams && studyConfig.exams[0];
    if(!ex || !ex.date) return '';
    const p = ex.date.split('-');
    const target = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); target.setHours(0,0,0,0);
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((target.getTime() - today.getTime()) / 86400000);
    const label = ex.name || '시험';
    if(diff > 0) return label + ' D-' + diff;
    if(diff === 0) return label + ' D-DAY';
    return label + ' D+' + (-diff);
  }

  // ===== 공부 속도계 =====
  // 구간 기준: 내 페이스 = 구간 순공 ÷ 구간 경과일,  기준 = 구간 경과일의 평일·주말 기준 평균,  cap = 주상한/7(초맥시멈)
  // 오늘은 기준만큼 채운 비율로만 경과일에 넣는다 — 하루가 안 끝났는데 미달로 보이지 않게
  // 하루 기준(사용자 2026-10-20 · 평일 4·주말 8 = 초맥시멈 = weekly_cap) · since = 이 기준을 세운 새 루틴 시작일 — 그 전 날짜엔 소급하지 않는다
  const STUDY_PACE = { weekday: 3.5, weekend: 7, since: '2026-10-18' };  // since = 새 루틴이 든 주의 일요일(이번 주 줄과 같은 날부터)
  function parseDateKey(dk){
    const p = String(dk).split('-');
    const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function studyEarliestKey(){
    let min = null;
    listKeys('study:').forEach(k => {
      if(studyDayHours(getKey(k)) > 0){ const dk = k.slice(6); if(!min || dk < min) min = dk; }
    });
    return min;
  }
  function paceColor(my, need){
    if(my >= need - 0.001) return 'var(--accent)';
    if(my >= need * 0.8)   return 'var(--amber)';
    return 'var(--warn)';
  }
  function renderStudyGauge(){
    const host = $('study-gauge');
    if(!host) return;
    const ex = studyConfig && studyConfig.exams && studyConfig.exams[0];
    if(!ex || !Array.isArray(ex.milestones) || !ex.milestones.length){ host.className = 'study-gauge empty'; host.innerHTML = ''; return; }
    const today = new Date(); today.setHours(0, 0, 0, 0);
    // 현재 구간 = 마감일이 오늘 이후인 첫 마일스톤 (없으면 마지막) · 시작 = 앞 구간 마감 다음날(1구간은 첫 기록일)
    let mi = ex.milestones.findIndex(m => parseDateKey(m.end).getTime() >= today.getTime());
    if(mi < 0) mi = ex.milestones.length - 1;
    const ms = ex.milestones[mi];
    const end = parseDateKey(ms.end);
    let start;
    if(mi > 0){ start = parseDateKey(ex.milestones[mi - 1].end); start.setDate(start.getDate() + 1); }
    else { const e = studyEarliestKey(); start = e ? parseDateKey(e) : new Date(today); }
    const phaseStart = new Date(start);
    const since = parseDateKey(STUDY_PACE.since);
    if(start.getTime() < since.getTime()) start = since;
    const last = today.getTime() < end.getTime() ? today : end;
    const dayTarget = d => isRestDay(d) ? 0 : (isWeekend(d) || SEOL_STUDY.has(dateKey(d))) ? STUDY_PACE.weekend : STUDY_PACE.weekday;
    const daysLeft = Math.max(0, Math.round((end - today) / 86400000));
    const phaseLbl = ms.phase ? (ex.name || '1차') + ' ' + ms.phase + '구간' : (ex.name || '1차');
    const md = d => (d.getMonth() + 1) + '/' + d.getDate();
    const fmtH = v => (Math.round(v * 10) / 10).toFixed(1);
    const fmtF = v => Number.isInteger(Math.round(v * 10) / 10) ? String(Math.round(v)) : fmtH(v);
    const sumT = (a, b) => { let s = 0; for(const d = new Date(a); d.getTime() <= b.getTime(); d.setDate(d.getDate() + 1)) s += dayTarget(d); return s; };
    const sumH = (a, b) => { let s = 0; for(const d = new Date(a); d.getTime() <= b.getTime(); d.setDate(d.getDate() + 1)) s += studyDayHours(getKey('study:' + dateKey(d))); return s; };
    // 구간 = 구간 첫날부터 · 기준 소급 ❌ — since 전 날은 한 시간을 그대로 목표로 친다(HQ semu_pacer prior 와 같은 방식)
    const pre = start.getTime() > phaseStart.getTime() ? sumH(phaseStart, new Date(start.getTime() - 86400000)) : 0;
    const ph = { got: pre + sumH(start, last), now: pre + sumT(start, last), fin: pre + sumT(start, end) };
    // 이번 주 = 일요일~토요일(달력과 같은 주)
    const ws = new Date(today); ws.setDate(ws.getDate() - today.getDay());
    const we = new Date(ws); we.setDate(we.getDate() + 6);
    const wk = { got: sumH(ws, today), now: sumT(ws, today), fin: sumT(ws, we) };
    // 반원 하나 = 한 시간 ÷ 지금까지 목표(오늘 몫 전부) · 검은 눈금 = 100% · 오른쪽 끝 = 초맥시멈(weekly_cap ÷ 기준 주간합)
    const top = (ex.weekly_cap || 36) / (STUDY_PACE.weekday * 5 + STUDY_PACE.weekend * 2);
    const cx = 100, cy = 98, r = 82;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const angOf = v => Math.PI * (1 - clamp(v / top, 0, 1));
    const polar = (a, rr) => [cx + Math.cos(a) * rr, cy - Math.sin(a) * rr];
    const arc = (a0, a1, c) => {
      const [x0, y0] = polar(a0, r), [x1, y1] = polar(a1, r);
      const large = (a0 - a1) > Math.PI ? 1 : 0;
      return `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/>`;
    };
    const one = (name, range, o) => {
      const on = o.now > 0.001;
      const ratio = on ? o.got / o.now : 0;
      const col = on ? paceColor(o.got, o.now) : 'var(--text-tertiary)';
      const tA = angOf(1);
      const [nx, ny] = polar(angOf(ratio), r - 12);
      const [tx0, ty0] = polar(tA, r - 14), [tx1, ty1] = polar(tA, r + 5);
      return `<div class="sg-col"><div class="sg-name">${name}</div><div class="sg-date">${range}</div>` +
        `<svg class="sg-svg" viewBox="0 0 200 114">` +
          arc(Math.PI, 0.001, 'var(--bg-tertiary)') +
          arc(tA, 0.001, 'var(--accent-bg)') +
          `<line x1="${tx0.toFixed(1)}" y1="${ty0.toFixed(1)}" x2="${tx1.toFixed(1)}" y2="${ty1.toFixed(1)}" stroke="var(--text-primary)" stroke-width="2"/>` +
          `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${col}" stroke-width="4" stroke-linecap="round"/>` +
          `<circle cx="${cx}" cy="${cy}" r="5.5" fill="${col}"/>` +
        `</svg>` +
        `<div class="sg-pct" style="color:${col}">${on ? Math.round(ratio * 100) + '%' : '시작'}</div>` +
        `<div class="sg-line"><b>${fmtH(o.got)}</b> / ${fmtH(o.now)}<span class="sg-fin">${fmtF(o.fin)}</span>h</div></div>`;
    };
    host.className = 'study-gauge';
    host.innerHTML =
      `<div class="sg-top"><span class="sg-name">${phaseLbl}</span><span class="sg-date">D-${daysLeft}</span></div>` +
      `<div class="sg-row">` +
        one('이번 주', `${md(ws)}~${md(we)}`, wk) +
        one(ms.phase ? ms.phase + '구간' : '구간', `${md(phaseStart)}~${md(end)}`, ph) +
      `</div>`;
  }

  function renderStudy(){
    studyDay = loadStudyDay(viewDate);
    const wrap = $('study-cards');
    wrap.innerHTML = '';
    const step = studyConfig.hours_step || 0.5;
    studyConfig.subjects.forEach(name => {
      const row = document.createElement('div');
      row.className = 'study-row';
      row.innerHTML =
        '<div class="study-name"></div>' +
        '<div class="study-ctrl">' +
          '<button type="button" class="study-step" data-act="dec">−</button>' +
          '<span class="study-hours"></span>' +
          '<button type="button" class="study-step" data-act="inc">+</button>' +
        '</div>';
      row.querySelector('.study-name').textContent = name;
      const hoursEl = row.querySelector('.study-hours');
      const decBtn = row.querySelector('[data-act="dec"]');
      const incBtn = row.querySelector('[data-act="inc"]');
      function curHours(){ const v = studyDay.hours[name]; return (typeof v === 'number') ? v : 0; }
      function refresh(){
        const cur = curHours();
        hoursEl.textContent = cur.toFixed(1) + 'h';
        decBtn.disabled = cur <= studyConfig.hours_min + EPSILON;
        incBtn.disabled = cur >= studyConfig.hours_max - EPSILON;
      }
      function change(delta){
        let cur = Math.round((curHours() + delta) / step) * step;
        cur = Math.min(studyConfig.hours_max, Math.max(studyConfig.hours_min, cur));
        cur = Math.round(cur * 10) / 10;
        if(cur > 0) studyDay.hours[name] = cur; else delete studyDay.hours[name];
        refresh();
        saveStudyDay(viewDate, studyDay);
        recomputeStudyTotal();
        updateStudySummary();
        paintCalCell(viewDate);
        haptic();
      }
      decBtn.addEventListener('click', () => change(-step));
      incBtn.addEventListener('click', () => change(step));
      refresh();
      wrap.appendChild(row);
    });
    updateStudySummary();
  }

  function collectStudy(){

    let total = 0;

  // 설정은 신규 키 'sync'에만 저장 — 기존 day:/legacy:/config/total_liter/study 와 무관.
  function getSyncConfig(){
    const s = getKey('sync') || {};
    let routinePath = s.routine_path;
    if(!routinePath){ routinePath = (s.path && s.path !== 'journal.json') ? s.path : 'daily_routine.json'; }

    };

  function saveSyncConfig(cfg){ setKey('sync', cfg); }

  function toBase64(str){
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function fromBase64(b64){
    const bin = atob(String(b64).replace(/\s/g, ''));
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  // 기록된 날 수 (day + legacy 또는 study days) — 빈 데이터 판별용
  function recordEntryCount(rec){
    let n = 0;
    if(rec && rec.days   && typeof rec.days   === 'object') n += Object.keys(rec.days).length;
    if(rec && rec.legacy && typeof rec.legacy === 'object') n += Object.keys(rec.legacy).length;
    return n;
  }
  async function safeErr(res){
    try { const j = await res.json(); return (j && j.message) ? j.message : (res.statusText || ''); }
    catch(e){ return res.statusText || ''; }
  }
  function ghHeaders(cfg){
    return { 'Authorization': 'Bearer ' + cfg.pat, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  }
  function ghUrl(cfg, path){
    const encPath = path.split('/').map(encodeURIComponent).join('/');
    return 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + encPath;
  }

  // 한 파일 올리기 (sha 조회→PUT). 폰이 비었는데 repo에 데이터면 차단.
  async function ghPutFile(cfg, path, jsonObj){
    const apiUrl = ghUrl(cfg, path);
    const headers = ghHeaders(cfg);
    const localCount = recordEntryCount(jsonObj);
    const content = toBase64(JSON.stringify(jsonObj, null, 2));
    let sha = null;
    const getRes = await fetch(apiUrl + '?ref=' + encodeURIComponent(cfg.branch), { headers: headers });
    if(getRes.ok){
      const j = await getRes.json();
      sha = j && j.sha ? j.sha : null;
      if(localCount === 0 && j && j.content){
        let remoteCount = 0;
        try { remoteCount = recordEntryCount(JSON.parse(fromBase64(j.content))); } catch(e){}
        if(remoteCount > 0) throw new Error(path + ': 폰이 비었는데 repo에 ' + remoteCount + '건 — 덮어쓰기 차단(복구를 쓰세요)');
      }
    } else if(getRes.status !== 404){
      throw new Error(path + ' 조회 실패 ' + getRes.status + ': ' + await safeErr(getRes));
    }
    const body = { message: path.replace(/\.json$/, '') + ' sync ' + dateKey(new Date()), content: content, branch: cfg.branch };
    if(sha) body.sha = sha;
    const putRes = await fetch(apiUrl, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, headers), body: JSON.stringify(body) });
    if(!putRes.ok) throw new Error(path + ' 올리기 실패 ' + putRes.status + ': ' + await safeErr(putRes));
    const pj = await putRes.json();
    return (pj && pj.commit && pj.commit.sha) ? pj.commit.sha.slice(0,7) : '?';
  }

  async function ghGetFile(cfg, path){
    const res = await fetch(ghUrl(cfg, path) + '?ref=' + encodeURIComponent(cfg.branch), { headers: ghHeaders(cfg) });
    if(res.status === 404) return null;
    if(!res.ok) throw new Error(path + ' 조회 실패 ' + res.status + ': ' + await safeErr(res));
    const j = await res.json();
    if(!j || !j.content) return null;
    try { return JSON.parse(fromBase64(j.content)); } catch(e){ throw new Error(path + ' 파싱 실패'); }
  }

  function validSyncCfg(cfg){
    if(!cfg.pat){ toast('PAT를 입력하세요 (설정)', 'err'); return false; }
    if(!cfg.owner){ toast('owner를 입력하세요 (설정)', 'err'); return false; }
    if(!cfg.repo){ toast('레포명을 입력하세요', 'err'); return false; }
    return true;
  }

  let syncBusy = false;
  async function syncUp(cfg){
    if(syncBusy) return;
    if(!validSyncCfg(cfg)) return;
    syncBusy = true;
    toast('올리기 중…', '');
    try {
      await ghPutFile(cfg, cfg.routine_path, collectRecord());
      await ghPutFile(cfg, cfg.study_path, collectStudy());
      setKey('last_sync', new Date().toISOString());
      updateLastSync();
      const now = new Date();
      toast('올리기 완료 · 2/2 · ' + pad(now.getHours()) + ':' + pad(now.getMinutes()), 'ok');
    } catch(e){
      toast('올리기 실패: ' + (e && e.message ? e.message : e), 'err');
    } finally { syncBusy = false; }
  }

  async function syncDown(cfg){
    if(syncBusy) return;
    if(!validSyncCfg(cfg)) return;
    const localCount = recordEntryCount(collectRecord()) + Object.keys(collectStudy().days).length;
    if(localCount > 0 && !window.confirm('repo 데이터로 폰을 덮어씁니다. 폰의 현재 기록이 사라질 수 있어요. 계속할까요?')) return;
    syncBusy = true;
    toast('복구 중…', '');
    try {
      const r = await ghGetFile(cfg, cfg.routine_path);
      const s = await ghGetFile(cfg, cfg.study_path);
      let n = 0;
      if(r){ applyRoutineData(r); n++; }
      if(s){ applyStudy(s); n++; }
      setKey('last_sync', new Date().toISOString());
      updateLastSync();
      reloadAll();
      toast(n > 0 ? ('복구 완료 · ' + n + '/2') : '복구할 데이터가 repo에 없습니다', n > 0 ? 'ok' : 'err');
    } catch(e){
      toast('복구 실패: ' + (e && e.message ? e.message : e), 'err');
    } finally { syncBusy = false; }
  }

  // ===== 설정(⚙) 화면 =====
  function setMsg(text, kind){
    const m = $('set-msg'); m.textContent = text; m.className = 'modal-msg' + (kind ? ' ' + kind : '');
  }
  function updateLastSync(){
    const ls = getKey('last_sync');
    $('set-lastsync').textContent = '마지막 동기화: ' + (ls ? ls.replace('T', ' ').slice(0, 16) : '없음');
  }
  function openSettings(){
    const cfg = getSyncConfig();
    $('set-owner').value = cfg.owner;
    $('set-repo').value = cfg.repo;
    $('set-branch').value = cfg.branch;
    $('set-pat').value = cfg.pat;
    $('set-routine-path').value = cfg.routine_path;
    $('set-study-path').value = cfg.study_path;
    setMsg('', '');
    updateLastSync();
    $('modal-settings').classList.remove('hidden');
  }
  function closeSettings(){
    saveSyncConfig(readSyncInputs());
    $('modal-settings').classList.add('hidden');
  }

  // ===== 하단 바 / 설정 wiring =====

  // 좌우 스와이프 = 탭 이동(왼쪽으로 밀면 F · 오른쪽이면 S) — 화면이 손가락을 따라오고, 넘기면 밀려 나가며 새 화면이 들어온다
  // 갈 곳 없는 쪽은 고무줄처럼 조금만 끌린다 · 짧아도 빠르게 튕기면(플릭) 넘어간다
  // 캡처 단계에서 가로채 달력 칸 탭(날짜 선택)으로 새지 않게 한다
  const SWIPE_MIN = 60, FLICK_MIN = 25, FLICK_SPEED = 0.4;   // px · px · px/ms
  const SLIDE_EASE = 'cubic-bezier(0.2, 0.8, 0.2, 1)';
  const appEl = $('app');
  let swX = null, swY = 0, swT = 0, swDx = 0, swLock = null, sliding = false;
  function setShift(x, ms){
    appEl.style.transition = ms ? `transform ${ms}ms ${SLIDE_EASE}, opacity ${ms}ms ${SLIDE_EASE}` : 'none';
    appEl.style.transform = x ? `translateX(${x}px)` : '';
    appEl.style.opacity = x ? String(Math.max(0.3, 1 - Math.abs(x) / window.innerWidth)) : '';
  }
  function slideTo(next){
    if(sliding) return;
    if(next === currentView){ setShift(0, 180); return; }
    sliding = true;
    const out = next === 'habit' ? -window.innerWidth : window.innerWidth;
    setShift(out * 0.6, 140);
    setTimeout(() => {
      showView(next);
      setShift(-out * 0.3, 0);
      void appEl.offsetWidth;
      setShift(0, 240);
      setTimeout(() => { sliding = false; appEl.style.transition = ''; }, 250);
    }, 140);
  }
  appEl.addEventListener('touchstart', (e) => {
    if(sliding || e.touches.length !== 1){ swX = null; return; }
    swX = e.touches[0].clientX; swY = e.touches[0].clientY; swT = Date.now(); swDx = 0; swLock = null;
  }, { passive: true, capture: true });
  appEl.addEventListener('touchmove', (e) => {
    if(swX === null || !e.touches[0]) return;
    const dx = e.touches[0].clientX - swX, dy = e.touches[0].clientY - swY;
    if(!swLock && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) swLock = Math.abs(dx) > Math.abs(dy) * 1.5 ? 'h' : 'v';
    if(swLock !== 'h') return;
    swDx = (dx < 0 ? 'habit' : 'study') === currentView ? dx * 0.2 : dx;
    setShift(swDx, 0);
  }, { passive: true, capture: true });
  appEl.addEventListener('touchend', (e) => {
    if(swX === null) return;
    swX = null;
    if(swLock !== 'h') return;
    e.stopPropagation(); e.preventDefault();
    const next = swDx < 0 ? 'habit' : 'study';
    const dist = Math.abs(swDx), speed = dist / Math.max(1, Date.now() - swT);
    if(next !== currentView && (dist >= SWIPE_MIN || (dist >= FLICK_MIN && speed >= FLICK_SPEED))){ slideTo(next); haptic(); }
    else setShift(0, 180);
  }, { passive: false, capture: true });
  appEl.addEventListener('touchcancel', () => { if(swX !== null && swLock === 'h') setShift(0, 180); swX = null; }, { passive: true, capture: true });
  $('nav-sync').addEventListener('click', () => {
    const cfg = getSyncConfig();
    if(!cfg.pat || !cfg.owner){ toast('먼저 설정에서 토큰을 입력하세요', 'err'); openSettings(); return; }
    syncUp(cfg);
  });
  $('nav-settings').addEventListener('click', openSettings);
  $('set-close').addEventListener('click', closeSettings);
  $('set-up').addEventListener('click', () => { const cfg = readSyncInputs(); saveSyncConfig(cfg); syncUp(cfg); });
  $('set-down').addEventListener('click', () => { const cfg = readSyncInputs(); saveSyncConfig(cfg); syncDown(cfg); });
  $('set-raw-routine').addEventListener('click', () => openRawModal('routine'));
  $('set-raw-study').addEventListener('click', () => openRawModal('study'));

  try {
    const cr = loadConfig();
    config = cr.config;
    computeItemLiters();

    runLegacyImport();
    initTotalLiter();
    recomputeItemCounts();

    // 스터디 초기화 (습관과 독립)
    studyConfig = loadStudyConfig();
    recomputeStudyTotal();

    showView('study');
    refreshMemo();
    $('loading').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('navbar').classList.remove('hidden');
  } catch(e){
    $('loading').textContent = '오류: ' + (e && e.message ? e.message : '알 수 없음');
  }

  // service worker 등록 — 홈화면 웹클립이 켤 때마다 최신 버전을 받게(network-first).
  // 데이터(localStorage)는 건드리지 않음. 실패해도 앱 동작에는 영향 없음.
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
